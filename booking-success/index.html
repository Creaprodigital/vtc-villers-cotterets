<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Paiement — TAOL VTC Villers-Cotterêts</title>
  <link rel="stylesheet" href="../assets/site.css?v=20261110-2">
  <link rel="stylesheet" href="../assets/rbs-booking.css?v=20261110-2">
</head>
<body>
  <main class="container" style="padding:48px 16px">
    <!-- Page de retour Stripe : {origin_url}/booking-success?session_id=… -->
    <div class="rbs" id="status" role="status" aria-live="polite">
      <div class="rbs-loading"><span class="rbs-spinner" aria-hidden="true"></span> Vérification de votre paiement…</div>
    </div>
  </main>
  <script>
  (function () {
    var API = "https://ridebookingsystem.com/api";
    var box = document.getElementById("status");
    var sessionId = new URLSearchParams(location.search).get("session_id");
    var delays = [800, 800, 800, 1200, 1200, 2000, 2000, 3000, 3000, 5000, 5000, 5000];

    function show(ok, title, text) {
      box.innerHTML = "";
      var wrap = document.createElement("div");
      wrap.className = "rbs-confirm";
      wrap.innerHTML = '<div class="rbs-confirm-icon" aria-hidden="true"></div><h1 class="rbs-title"></h1><p class="rbs-subtitle"></p><a class="rbs-btn rbs-btn--primary" href="../#reservation"></a>';
      wrap.querySelector(".rbs-confirm-icon").textContent = ok ? "✓" : "!";
      wrap.querySelector("h1").textContent = title;
      wrap.querySelector("p").textContent = text;
      wrap.querySelector("a").textContent = ok ? "Retour au site" : "Revenir à la réservation";
      box.appendChild(wrap);
    }

    if (!sessionId) { show(false, "Paiement introuvable", "La session de paiement est absente de l'adresse."); return; }

    function poll(i) {
      fetch(API + "/public/payment/status/" + encodeURIComponent(sessionId))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && (d.payment_status === "paid" || d.status === "completed")) {
            show(true, "Paiement confirmé", "Merci ! Votre réservation est confirmée, un email récapitulatif vous a été envoyé.");
          } else if (d && (d.payment_status === "failed" || d.status === "expired" || d.status === "cancelled")) {
            show(false, "Paiement non abouti", "Le paiement n'a pas été validé. Vous pouvez réessayer depuis le formulaire de réservation.");
          } else if (i < delays.length) {
            setTimeout(function () { poll(i + 1); }, delays[i]);
          } else {
            show(true, "Paiement en cours de validation", "Votre paiement est en cours de traitement. Vous recevrez un email dès sa confirmation.");
          }
        })
        .catch(function () {
          if (i < delays.length) setTimeout(function () { poll(i + 1); }, delays[i]);
          else show(false, "Vérification impossible", "Nous n'avons pas pu vérifier le paiement. Consultez votre email de confirmation.");
        });
    }
    poll(0);
  })();
  </script>
</body>
</html>
