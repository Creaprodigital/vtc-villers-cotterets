# Déploiement automatique du site sur Hostinger (FTP) à chaque mise à jour de main.
#
# Secrets à créer dans GitHub : Settings → Secrets and variables → Actions
#   FTP_SERVER     ex. ftp.votre-domaine.fr ou l'IP indiquée dans hPanel
#   FTP_USERNAME   ex. u123456789.votre-domaine.fr
#   FTP_PASSWORD   mot de passe du compte FTP
#   FTP_SERVER_DIR (facultatif) dossier distant, par défaut "public_html/"
# Infos FTP : hPanel → Sites web → votre domaine → Fichiers → Comptes FTP.
name: Déploiement Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la configuration FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Seulement pour détecter une erreur fréquente : valeurs saisies en « Variables »
          # au lieu de « Secrets ». Leur contenu n'est jamais affiché.
          VAR_FTP_SERVER: ${{ vars.FTP_SERVER }}
          VAR_FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          VAR_FTP_PASSWORD: ${{ vars.FTP_PASSWORD }}
        run: |
          missing=""
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
              var="VAR_$name"
              if [ -n "${!var}" ]; then
                echo "::error::$name est enregistré dans l'onglet « Variables ». Il doit être recréé dans l'onglet « Secrets » → Repository secrets."
              else
                echo "::error::Secret $name absent ou vide."
              fi
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Déploiement annulé, secrets manquants :$missing. À créer dans Settings → Secrets and variables → Actions → onglet Secrets → New repository secret (pas en Environment secret)."
            exit 1
          fi
          echo "Configuration FTP complète."

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Envoyer les fichiers sur Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .gitignore
            .github/**
            README.md
